[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "alpineguard"
version = "1.0.0"
description = "Lightweight OS health and security monitor for Alpine Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "AlpineGuard Contributors", email = "parthguntewar@gmail.com" },
]
keywords = ["linux", "monitoring", "alpine", "security", "system"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
# No runtime dependencies — standard library only
dependencies = []

[project.scripts]
alpineguard = "alpineguard.cli:run"

[project.urls]
Homepage = "https://github.com/parthguntewar/alpine-kernel-project"
Repository = "https://github.com/parthguntewar/alpine-kernel-project"

[tool.setuptools.packages.find]
where = ["."]
include = ["alpineguard*"]
